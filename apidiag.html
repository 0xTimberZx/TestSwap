<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TimbSwap /api diagnostic</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0b0f14; color:#e6edf3;
         font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         padding:18px 16px 60px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#8b98a5; font-size:13px; margin:0 0 18px; }
  .card { background:#121821; border:1px solid #1e2733; border-radius:12px;
          padding:14px 14px; margin:0 0 14px; }
  .label { font-size:12px; letter-spacing:.04em; text-transform:uppercase;
           color:#8b98a5; margin:0 0 6px; }
  .val { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px;
         word-break:break-all; white-space:pre-wrap; }
  .pill { display:inline-block; font-weight:700; padding:2px 10px; border-radius:999px;
          font-size:13px; }
  .ok  { background:#0f3d2e; color:#3ddc97; }
  .bad { background:#3d1717; color:#ff6b6b; }
  .wait{ background:#28303c; color:#8b98a5; }
  button { margin-top:8px; background:#3ddc97; color:#04110b; border:0; font-weight:700;
           padding:12px 18px; border-radius:10px; font-size:15px; width:100%; }
</style>
</head>
<body>
  <h1>TimbSwap /api diagnostic</h1>
  <p class="sub">Same-origin test of the Cloudflare Worker. Open this on the same browser/device that shows the dashes.</p>

  <div class="card">
    <p class="label">Loaded config (config.js)</p>
    <div class="val" id="cfg">checking…</div>
  </div>

  <div class="card">
    <p class="label">POST /api/rpc &nbsp;→&nbsp; eth_blockNumber</p>
    <div id="rpc-pill" class="pill wait">running…</div>
    <div class="val" id="rpc" style="margin-top:8px;">…</div>
  </div>

  <div class="card">
    <p class="label">POST /api/debughub_events &nbsp;→&nbsp; test event</p>
    <div id="tel-pill" class="pill wait">running…</div>
    <div class="val" id="tel" style="margin-top:8px;">…</div>
  </div>

  <button onclick="location.reload()">Run again</button>

  <!-- Load the real config so we can show exactly what the app is using. -->
  <script>document.write('<script src="config.js?t=' + Date.now() + '"><\/script>');</script>
  <script>
  (function () {
    var cfgEl = document.getElementById('cfg');
    try {
      var rpc = (typeof DEDICATED_RPC !== 'undefined') ? DEDICATED_RPC : '(DEDICATED_RPC undefined)';
      var tel = (window.DEBUGHUB_CONFIG && window.DEBUGHUB_CONFIG.telemetryUrl) || '(telemetryUrl unset)';
      cfgEl.textContent = 'DEDICATED_RPC = ' + rpc + '\ntelemetryUrl  = ' + tel;
    } catch (e) { cfgEl.textContent = 'config read error: ' + e.message; }

    function setPill(id, ok, text) {
      var p = document.getElementById(id);
      p.className = 'pill ' + (ok ? 'ok' : 'bad');
      p.textContent = text;
    }

    // ── /api/rpc ──
    fetch('/api/rpc', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}'
    }).then(function (r) {
      return r.text().then(function (body) {
        var ok = r.ok && body.indexOf('"result"') !== -1;
        setPill('rpc-pill', ok, 'HTTP ' + r.status + (ok ? '  OK' : '  FAIL'));
        document.getElementById('rpc').textContent = body || '(empty body)';
      });
    }).catch(function (e) {
      setPill('rpc-pill', false, 'NETWORK ERROR');
      document.getElementById('rpc').textContent = e.message;
    });

    // ── /api/debughub_events ──
    fetch('/api/debughub_events', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ app: 'TimbSwap', type: 'checkpoint', name: 'apidiag-smoke', status: 'pass' })
    }).then(function (r) {
      return r.text().then(function (body) {
        var ok = r.ok; // relay returns 201/204 with empty body on success
        setPill('tel-pill', ok, 'HTTP ' + r.status + (ok ? '  OK' : '  FAIL'));
        document.getElementById('tel').textContent = body ? body : '(empty body — success looks like HTTP 201/204)';
      });
    }).catch(function (e) {
      setPill('tel-pill', false, 'NETWORK ERROR');
      document.getElementById('tel').textContent = e.message;
    });
  })();
  </script>
</body>
</html>
