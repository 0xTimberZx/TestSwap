name = "timbswap-api"
main = "timbswap-api.js"
compatibility_date = "2026-09-05"

# One route catches every /api/* path on the apex domain; all other paths fall
# through to the origin (GitHub Pages). Requires the zone to be on Cloudflare.
routes = [
  { pattern = "timbswap.xyz/api/*", zone_name = "timbswap.xyz" }
]

# Non-secret vars — the Supabase edge-function URLs the /api/* routes relay to.
# Not sensitive (public function URLs). Replace the ref before deploying.
[vars]
WAITLIST_UPSTREAM = "https://ipyfodnidwsdvwqrcjrl.supabase.co/functions/v1/waitlist"
QUESTS_UPSTREAM   = "https://ipyfodnidwsdvwqrcjrl.supabase.co/functions/v1/quests"
FAUCET_UPSTREAM   = "https://ipyfodnidwsdvwqrcjrl.supabase.co/functions/v1/faucet-claim"
PRESENCE_UPSTREAM = "https://ipyfodnidwsdvwqrcjrl.supabase.co/functions/v1/presence"
GAS_BOARD_UPSTREAM = "https://ipyfodnidwsdvwqrcjrl.supabase.co/functions/v1/gas-board"
REFERRALS_UPSTREAM = "https://ipyfodnidwsdvwqrcjrl.supabase.co/functions/v1/referrals"

# Secrets are NOT set here — add them with `wrangler secret put`:
#   ALCHEMY_RPC_URL        (for POST /api/rpc)
#   WAITLIST_PROXY_SECRET  (optional; for POST /api/waitlist — must match the
#                           waitlist edge function's WAITLIST_PROXY_SECRET)
#   FAUCET_PROXY_SECRET    (optional; for POST /api/faucet-claim — must match the
#                           faucet-claim edge function's FAUCET_PROXY_SECRET)
#   PRESENCE_PROXY_SECRET  (optional; for POST /api/presence — must match the
#                           presence edge function's PRESENCE_PROXY_SECRET)
#   GAS_BOARD_PROXY_SECRET (optional; for POST /api/gas-board — must match the
#                           gas-board edge function's GAS_BOARD_PROXY_SECRET)
#   REFERRALS_PROXY_SECRET (optional; for POST /api/referrals — must match the
#                           referrals edge function's REFERRALS_PROXY_SECRET)
