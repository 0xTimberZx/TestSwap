name: TimbSwap Reclaim Reminder

on:
  schedule:
    - cron: "17 * * * *"           # backstop only — see the self-chain below
  workflow_dispatch:

# One reminder at a time: a run lingers ~55 min watching the round number
# (REMIND_LINGER_MINUTES), so overlapping ticks queue. Read-only on-chain and
# the DMs are deduped in Postgres, so a queued run starting late is harmless.
concurrency:
  group: timbswap-reclaim-reminder
  cancel-in-progress: false

jobs:
  remind:
    name: DM holders before their refund lapses
    runs-on: ubuntu-latest
    # Must exceed REMIND_LINGER_MINUTES (default 55).
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install ethers
        working-directory: scripts

      - name: Run reclaim reminder
        working-directory: scripts
        env:
          ARB_RPC:               ${{ secrets.ARB_RPC }}
          ARB_SEPOLIA_RPC:       ${{ secrets.ARB_SEPOLIA_RPC }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_USERNAME: SettlerTimbBot
          REMIND_LEAD_ROUNDS:    ${{ vars.REMIND_LEAD_ROUNDS }}
          SCAN_BACK_ROUNDS:      ${{ vars.RECLAIM_SCAN_BACK_ROUNDS }}
          COMPETE_URL:           https://timbswap.xyz/compete
          REMIND_LINGER_MINUTES: ${{ vars.REMIND_LINGER_MINUTES }}
          REMIND_POLL_SECONDS:   ${{ vars.REMIND_POLL_SECONDS }}
          REMIND_RESCAN_SECONDS: ${{ vars.REMIND_RESCAN_SECONDS }}
        run: node reclaim-reminder.js

      # ── Self-chaining ─────────────────────────────────────────────────────
      # GitHub fires the hourly cron late and unevenly (the fleet heartbeat
      # measured runs up to three hours apart). Like the settler, the faucet,
      # and the match notifier: each SUCCESSFUL run dispatches the next, so the
      # reminder is self-perpetuating and cron only restarts a broken chain.
      # Only on success — a run whose every poll failed exits non-zero so a
      # dead RPC cannot become an infinite re-dispatch loop.
      #
      # Token: a fine-grained PAT with Actions read/write on this repo (the
      # default GITHUB_TOKEN cannot trigger workflow runs). Falls back to the
      # faucet's, then the settler's, so no new secret is needed to switch on.
      - name: Dispatch next reminder run
        if: success()
        env:
          DISPATCH_TOKEN: ${{ secrets.RECLAIM_REMINDER_DISPATCH_TOKEN || secrets.FAUCET_DISPATCH_TOKEN || secrets.SETTLER_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "No dispatch token secret — relying on cron for the next run."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/reclaim-reminder.yml/dispatches" \
            -d '{"ref":"main"}' \
            && echo "Next reminder run dispatched." \
            || echo "::warning::Dispatch rejected by the API — the self-chain is broken until cron restarts it. Check the dispatch token secret."
