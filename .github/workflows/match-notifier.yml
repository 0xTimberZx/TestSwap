name: TimbSwap Match Notifier

on:
  schedule:
    - cron: "*/15 * * * *"         # backstop only — see the self-chain below
  workflow_dispatch:

# One notifier at a time: a run lingers ~55 min polling for the segment-1 lock
# (MATCH_LINGER_MINUTES), so overlapping ticks queue. Read-only on-chain and
# the DMs are deduped in Postgres, so a queued run starting late is harmless.
concurrency:
  group: timbswap-match-notifier
  cancel-in-progress: false

jobs:
  notify:
    name: DM holders whose first letter matches segment 1
    runs-on: ubuntu-latest
    # Must exceed MATCH_LINGER_MINUTES (default 55).
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install ethers
        working-directory: scripts

      - name: Run match notifier
        working-directory: scripts
        env:
          ARB_RPC:               ${{ secrets.ARB_RPC }}
          ARB_SEPOLIA_RPC:       ${{ secrets.ARB_SEPOLIA_RPC }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_USERNAME: SettlerTimbBot
          COMPETE_URL:           https://timbswap.xyz/compete
          MATCH_LINGER_MINUTES:  ${{ vars.MATCH_LINGER_MINUTES }}
          MATCH_POLL_SECONDS:    ${{ vars.MATCH_POLL_SECONDS }}
          MATCH_RESCAN_SECONDS:  ${{ vars.MATCH_RESCAN_SECONDS }}
        run: node match-notifier.js

      # ── Self-chaining ─────────────────────────────────────────────────────
      # GitHub fires the */15 cron at a fraction of the asked rate (the fleet
      # heartbeat measured runs two to five hours apart). Like the settler and
      # the faucet: each SUCCESSFUL run dispatches the next, so the notifier is
      # self-perpetuating and cron is only the backstop that restarts a broken
      # chain. Only on success — a run whose every pass failed exits non-zero
      # so a dead RPC cannot become an infinite re-dispatch loop.
      #
      # Token: a fine-grained PAT with Actions read/write on this repo (the
      # default GITHUB_TOKEN cannot trigger workflow runs). Falls back to the
      # faucet's, then the settler's, so no new secret is needed to switch on.
      - name: Dispatch next notifier run
        if: success()
        env:
          DISPATCH_TOKEN: ${{ secrets.MATCH_NOTIFIER_DISPATCH_TOKEN || secrets.FAUCET_DISPATCH_TOKEN || secrets.SETTLER_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "No dispatch token secret — relying on cron for the next run."
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/match-notifier.yml/dispatches" \
            -d '{"ref":"main"}' \
            && echo "Next notifier run dispatched." \
            || echo "Dispatch failed — cron backstop will pick up."
