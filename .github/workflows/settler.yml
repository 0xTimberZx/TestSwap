name: TimbSwap Settler

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "settle"
        type: choice
        options:
          - settle
          - health

# One settler at a time: runs linger up to ~65 min waiting for the segment
# boundary, so overlapping scheduled ticks must queue, not double-settle.
concurrency:
  group: timbswap-settler
  cancel-in-progress: false

jobs:
  settle:
    name: Settle segment
    runs-on: ubuntu-latest
    # Must exceed the settler's linger budget (SETTLER_LINGER_MINUTES, 65).
    timeout-minutes: 70

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install ethers
        working-directory: scripts

      - name: Run settler
        working-directory: scripts
        env:
          ARB_SEPOLIA_RPC:      ${{ secrets.ARB_SEPOLIA_RPC }}
          SETTLER_PRIVATE_KEY:  ${{ secrets.SETTLER_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "health" ] || \
             [ "${{ github.event.schedule }}" = "0 12 * * *" ]; then
            node settler.js --health
          else
            node settler.js
          fi
