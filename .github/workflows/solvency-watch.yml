name: TimbSwap Solvency Watch

# Read-only watchdog (scripts/solvency-watch.js): does the ETH the game holds
# cover what it owes? GameRegistry ETH vs every ETH ticket's principal and the
# totalEthEscrow meter; PrizeEscrow ETH vs pot + unclaimed winnings + protocol
# cut; terminal tickets hold nothing. A breach alerts the ops and critical chats
# for the owner to pause (pausing is owner-only; this job never pauses) and
# fails the run. No private key. The state file holds only the last-alert
# stamps, committed back so alerts stay throttled between runs.
#
# Pacing: GitHub delivers this repo's cron at roughly one tick in four to six,
# so like the rest of the fleet this job self-chains: check, commit state,
# sleep WATCH_LINGER_MINUTES (default 15), dispatch the next run. Cron is only
# the backstop that restarts a broken chain. The chain continues after a
# breach (exit 1) and after a failed read (exit 2), when the watch matters
# most, but not when the self-test fails, so a broken build cannot loop.

on:
  schedule:
    - cron: "11,41 * * * *"   # backstop only — see the self-chain below
  workflow_dispatch:
    inputs:
      report:
        description: "Post a Telegram summary even when healthy"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

concurrency:
  group: timbswap-solvency-watch
  cancel-in-progress: false

permissions:
  contents: write   # commits scripts/solvency-watch-state.json back

jobs:
  check:
    name: Check solvency
    runs-on: ubuntu-latest
    # Host gate, as the rest of the fleet: runs only when the repo variable
    # KEEPERS_HOST is 'actions', so it never runs alongside a Railway copy.
    if: vars.KEEPERS_HOST == 'actions'
    # Must exceed WATCH_LINGER_MINUTES (default 15) plus the check itself.
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.23.4"

      - name: Install dependencies
        run: npm ci --omit=dev
        working-directory: scripts

      - name: Self-test the checks
        working-directory: scripts
        run: node solvency-watch.js --self-test

      # continue-on-error: a breach exits 1 and a failed read exits 2 by design,
      # but the state commit, the linger and the dispatch below must still
      # happen. The run is marked red again at the end from the exit code.
      - name: Check the live contracts
        id: check
        continue-on-error: true
        working-directory: scripts
        env:
          # WATCH_RPC overrides the public read RPC in config.js; set it to an
          # Arbitrum One endpoint for a mainnet build. A keyed URL goes in a
          # SECRET (masked in logs); the variable is read only as a fallback.
          WATCH_RPC:            ${{ secrets.WATCH_RPC || vars.WATCH_RPC }}
          WATCH_REALERT_MIN:    ${{ vars.WATCH_REALERT_MIN }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OPS_BOT_TOKEN: ${{ secrets.TELEGRAM_OPS_BOT_TOKEN }}
          TELEGRAM_OPS_CHAT_ID: ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
          TELEGRAM_CRITICAL_BOT_TOKEN: ${{ secrets.TELEGRAM_CRITICAL_BOT_TOKEN }}
          TELEGRAM_CRITICAL_CHAT_ID: ${{ secrets.TELEGRAM_CRITICAL_CHAT_ID }}
        run: |
          set +e
          if [ "${{ github.event.inputs.report }}" = "yes" ]; then
            node solvency-watch.js --report
          else
            node solvency-watch.js
          fi
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # Commit the alert stamps back even when the check failed, so a standing
      # breach re-alerts hourly instead of every run.
      - name: Commit state
        if: always()
        run: |
          if [ ! -f scripts/solvency-watch-state.json ]; then
            echo "No state file — nothing to commit."
            exit 0
          fi
          if git diff --quiet scripts/solvency-watch-state.json 2>/dev/null && \
             ! git status --porcelain scripts/solvency-watch-state.json | grep -q .; then
            echo "No state change — nothing to commit."
            exit 0
          fi
          git config user.name  "solvency-watch[bot]"
          git config user.email "actions@github.com"
          git add scripts/solvency-watch-state.json
          git commit -m "[skip ci] solvency-watch: update alert state"
          # npm install dirties scripts/; --autostash keeps the rebase clean.
          git pull --rebase --autostash origin main
          git push origin main

      # ── Linger, then self-chain ────────────────────────────────────────────
      # The sleep paces the chain: the next run starts one linger after this
      # one's check, whatever cron does. Only after the script reached a verdict
      # (exit 0, 1 or 2); any other exit falls back to cron.
      - name: Linger until the next check is due
        if: contains(fromJSON('["0","1","2"]'), steps.check.outputs.code)
        env:
          WATCH_LINGER_MINUTES: ${{ vars.WATCH_LINGER_MINUTES }}
        run: |
          MIN="${WATCH_LINGER_MINUTES:-15}"
          echo "Lingering ${MIN} min before dispatching the next check."
          sleep "$(( MIN * 60 ))"

      - name: Dispatch next solvency check
        if: contains(fromJSON('["0","1","2"]'), steps.check.outputs.code)
        env:
          # FAUCET_DISPATCH_TOKEN first: it is the live PAT the fleet chains on.
          DISPATCH_TOKEN: ${{ secrets.WATCH_DISPATCH_TOKEN || secrets.FAUCET_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "No dispatch token secret — relying on cron for the next run."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/solvency-watch.yml/dispatches" \
            -d '{"ref":"main"}' \
            && echo "Next solvency check dispatched." \
            || echo "::warning::Dispatch rejected by the API — the self-chain is broken until cron restarts it. Check the dispatch token secret."

      # Red on a breach or a failed read, as before; this comes last so it
      # cannot stop the state commit, the linger or the dispatch.
      - name: Mark the run red unless solvent
        if: steps.check.outputs.code != '0'
        run: |
          echo "solvency-watch exited ${{ steps.check.outputs.code }} (1 = breach, 2 = could not read the chain)."
          exit 1
