name: Admin — Wind Down Old Testnet

# Manual-only owner action for the redeploy (scripts/wind-down-owner.js),
# signed by the old contracts' owner (the NEW_OWNER_PRIVATE_KEY secret, set by
# the 22 Oct rotation). In order:
#
#   pause     TimbPrize.pauseEntries; GasFaucet ETH and TIMBS legs paused.
#             Exits stay open (claims, refunds, LP, farm and lock withdrawals).
#   retire    TimbPrize.retire + GameRegistry.retireGame, only once the last
#             round has settled (segment 1 of the next is live) unless forced.
#   cut       TimbPrize.withdrawProtocolCut → recipient.
#   vault     TimbYieldVault.emergencyWithdraw of the free reserve → recipient.
#   treasury  every ETH, WETH, USDC, USDT, LINK, DAPP and pool-LP balance of the
#             old treasury → recipient. Old TIMBS is left behind.
#
# Every call is simulated from the owner first; one that would revert (the old
# contracts are older than this repo's source) is reported and skipped. The
# recipient defaults to the new deployer and may never be a leaked key or the
# signer. Always dry-run first: it prints the plan and sends nothing.
#
# TESTNET ONLY. Not gated on KEEPERS_HOST: it is a one-off you start by hand.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run prints the plan; run sends it"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - run
      steps:
        description: "Steps, comma-separated (pause,retire,cut,vault,treasury)"
        required: true
        default: "pause,retire,cut,vault,treasury"
      to:
        description: "Recipient (default: the new deployer, TSDeployer)"
        required: true
        default: "0xAA6820D22cF59C9d143fe1a943F19FE6EcdAd3a5"
      force_retire:
        description: "Retire even mid-round (normally waits for segment 1)"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: admin-wind-down
  cancel-in-progress: false

jobs:
  wind-down:
    name: Wind down the old testnet
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.23.4"

      - name: Install dependencies
        run: npm ci --omit=dev
        working-directory: scripts

      - name: Self-test
        run: node wind-down-owner.js --self-test
        working-directory: scripts

      - name: Wind down
        working-directory: scripts
        env:
          # Public RPC from config.js by default; WIND_DOWN_RPC variable overrides.
          WIND_DOWN_RPC:          ${{ vars.WIND_DOWN_RPC }}
          WIND_DOWN_PRIVATE_KEY:  ${{ secrets.NEW_OWNER_PRIVATE_KEY }}
          WIND_DOWN_TO:           ${{ github.event.inputs.to }}
          WIND_DOWN_STEPS:        ${{ github.event.inputs.steps }}
          WIND_DOWN_FORCE_RETIRE: ${{ github.event.inputs.force_retire == 'yes' && '1' || '' }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "run" ]; then
            node wind-down-owner.js --execute
          else
            node wind-down-owner.js
          fi
