name: TimbSwap Faucet Worker

on:
  schedule:
    - cron: "*/10 * * * *"          # backstop; the self-chain does the real work
  workflow_dispatch:

# One sender at a time — the faucet's whole safety model is a single nonce
# stream. Overlapping runs MUST queue, never send concurrently.
concurrency:
  group: timbswap-faucet
  cancel-in-progress: false

jobs:
  drain:
    name: Drain faucet queue
    runs-on: ubuntu-latest
    timeout-minutes: 60          # must exceed FAUCET_LINGER_MINUTES (55)

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install ethers
        working-directory: scripts

      - name: Run faucet worker
        working-directory: scripts
        env:
          ARB_RPC:              ${{ secrets.ARB_RPC }}
          FAUCET_PRIVATE_KEY:   ${{ secrets.FAUCET_PRIVATE_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          DRIP_ETH:             ${{ vars.FAUCET_DRIP_ETH }}
          POT_ETH:              ${{ vars.FAUCET_POT_ETH }}
          MIN_BALANCE_ETH:      ${{ vars.FAUCET_MIN_BALANCE_ETH }}
        run: node faucet-worker.js

      # Self-chain so the queue is served within seconds, not on the 10-min
      # cron. Same pattern as the settler; needs a SETTLER_DISPATCH_TOKEN-style
      # PAT (FAUCET_DISPATCH_TOKEN) with Actions read/write.
      - name: Dispatch next worker run
        if: always()
        env:
          DISPATCH_TOKEN: ${{ secrets.FAUCET_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "No FAUCET_DISPATCH_TOKEN — relying on cron for the next run."
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/faucet.yml/dispatches" \
            -d '{"ref":"main"}' \
            && echo "Next faucet run dispatched — chain continues." \
            || echo "Dispatch failed — cron backstop will pick up."
