name: Verify Contracts

# Manual-only: publish the source of deployed contracts on Sourcify (no key)
# and, when the ARBISCAN_API_KEY secret is set, on Arbiscan.
#
# The site says every deployed contract is cross-linked to verified source on
# Arbiscan and Sourcify (/source/, /gov/, /litepaper/). The gen-3 TimbPrize and
# GameRegistry were deployed without verification and stayed unverified; this
# closes that and catches the next one.
#
# Verification only matches when the build is the one that was deployed, so
# `ref` must be the commit the contracts were broadcast from, NOT main: the
# contracts have changed since. The job builds at that ref with that ref's own
# foundry.toml (same solc, optimizer, via_ir, evm_version) and submodules.
#   gen-3 TimbPrize + GameRegistry: 40edafcf (contracts unchanged until the
#   17d0c517 config cutover on 4 Sep 2026).
#
# Sourcify reads the constructor arguments from the creation transaction
# itself. Arbiscan needs them passed; --guess-constructor-args recovers them
# from the creation transaction through the same key.
#
# The status job always runs first: it lists the Sourcify and Arbiscan state
# of every address in config.js, so any other unverified contract shows up
# here too, with the compiler settings each verified contract was built with
# (a pair's settings are its factory's, for one).
#
# Early deploys (June-July) were not always built with the foundry.toml of
# their commit (some name solc 0.8.20 while the sources pin 0.8.24). The solc,
# evm and via_ir inputs override the ref's foundry.toml for the build and the
# verification alike; leave them empty to use the ref's own settings.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit the contracts were deployed from"
        required: true
        default: "40edafcf1df1143cadbf61d5cffc9cb86ba290cd"
      targets:
        description: "Comma-separated address:path:Name entries"
        required: true
        default: "0x6027a196b553cC016b2CA8fC4477B681a2Ca86AF:contracts/TimbPrize.sol:TimbPrize,0x11C240577Cc522BE3e0f4b1ac61f916e35cfDD65:contracts/GameRegistry.sol:GameRegistry"
      verifier:
        description: "Where to verify"
        required: false
        default: "both"
        type: choice
        options:
          - sourcify
          - arbiscan
          - both
      mode:
        description: "status = report only; verify = report, then verify the targets"
        required: false
        default: "verify"
        type: choice
        options:
          - status
          - verify
      solc:
        description: "Override solc version (e.g. 0.8.24); empty = ref's foundry.toml"
        required: false
        default: ""
      evm:
        description: "Override evm_version (paris / shanghai / cancun); empty = ref's"
        required: false
        default: ""
      via_ir:
        description: "Override via_ir (true / false); empty = ref's"
        required: false
        default: ""

permissions:
  contents: read

env:
  CHAIN_ID: "421614"
  SOURCIFY: "https://sourcify.dev/server"

jobs:
  status:
    name: Verification status of config.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: List verification state
        env:
          ARBISCAN_API_KEY: ${{ secrets.ARBISCAN_API_KEY }}
        run: |
          {
            echo "### Verification status, chain $CHAIN_ID"
            echo
            echo "| Contract | Address | Sourcify | Arbiscan | Built with |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          awk '/^const _SEPOLIA_ADDRESSES = \{/{f=1} f{print} f&&/^\};/{exit}' config.js \
            | grep -oE '^\s*[A-Za-z0-9_]+:\s*"0x[0-9a-fA-F]{40}"' \
            | sed -E 's/^\s*([A-Za-z0-9_]+):\s*"(0x[0-9a-fA-F]{40})"/\1 \2/' \
            | while read -r name addr; do
                sj=$(curl -sS -m 20 "$SOURCIFY/v2/contract/$CHAIN_ID/$addr?fields=compilation" || true)
                m=$(echo "$sj" | jq -r '.match // "none"' 2>/dev/null || echo error)
                built=$(echo "$sj" | jq -r 'if .compilation then "\(.compilation.compilerVersion) runs=\(.compilation.compilerSettings.optimizer.runs // "-") opt=\(.compilation.compilerSettings.optimizer.enabled | tostring) viaIR=\(.compilation.compilerSettings.viaIR // false) evm=\(.compilation.compilerSettings.evmVersion // "default") \(.compilation.fullyQualifiedName // "")" else "" end' 2>/dev/null || true)
                a="no key"
                if [ -n "$ARBISCAN_API_KEY" ]; then
                  aj=$(curl -sS -m 20 "https://api.etherscan.io/v2/api?chainid=$CHAIN_ID&module=contract&action=getsourcecode&address=$addr&apikey=$ARBISCAN_API_KEY" || true)
                  if echo "$aj" | jq -e '.status == "1" and (.result[0].SourceCode // "") != ""' >/dev/null 2>&1; then
                    a=verified
                    [ -z "$built" ] && built=$(echo "$aj" | jq -r '.result[0] | "\(.CompilerVersion) runs=\(.Runs) opt=\(.OptimizationUsed) evm=\(.EVMVersion) \(.ContractName)"')
                  elif echo "$aj" | jq -e '.status == "1"' >/dev/null 2>&1; then
                    a=none
                  else
                    a="error: $(echo "$aj" | jq -r '.result // .message' 2>/dev/null | head -c 80)"
                  fi
                  sleep 0.5
                fi
                printf '%-24s %s sourcify=%-12s arbiscan=%-10s %s\n' "$name" "$addr" "${m:-none}" "$a" "$built"
                echo "| $name | \`$addr\` | ${m:-none} | $a | $built |" >> "$GITHUB_STEP_SUMMARY"
              done
          echo
          echo "match / exact_match / verified = verified; none = not verified there."

  verify:
    name: Verify targets at ${{ inputs.ref }}
    needs: status
    if: inputs.mode == 'verify'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy commit (with submodules)
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Apply compiler overrides
        env:
          SOLC: ${{ inputs.solc }}
          EVM: ${{ inputs.evm }}
          VIA_IR: ${{ inputs.via_ir }}
        run: |
          # solc goes into the ref's foundry.toml itself: FOUNDRY_SOLC_VERSION
          # breaks config extraction at refs with an [etherscan] table, and
          # FOUNDRY_SOLC builds but leaves verify-contract unable to resolve
          # the target file.
          [ -n "$SOLC" ]   && sed -i -E "s/^solc_version\s*=.*/solc_version   = \"$SOLC\"/" foundry.toml
          # Refs before the July layout name src = "src", a folder that does
          # not exist; verify-contract only resolves targets inside src.
          src=$(sed -n -E 's/^src\s*=\s*"([^"]+)".*/\1/p' foundry.toml | head -1)
          if [ -n "$src" ] && [ ! -d "$src" ] && [ -d contracts ]; then
            sed -i -E 's/^src\s*=.*/src            = "contracts"/' foundry.toml
            echo "src \"$src\" missing at this ref; using contracts/"
          fi
          [ -n "$EVM" ]    && echo "FOUNDRY_EVM_VERSION=$EVM"   >> "$GITHUB_ENV"
          [ -n "$VIA_IR" ] && echo "FOUNDRY_VIA_IR=$VIA_IR"     >> "$GITHUB_ENV"
          true

      - name: Show the build settings in use
        run: |
          grep -E '^(solc_version|optimizer|optimizer_runs|via_ir|evm_version)\s*=' foundry.toml || true
          env | grep '^FOUNDRY_' || echo "no overrides"

      # Only the targets' source files (and their imports): an override such as
      # via_ir=false can leave other contracts at the ref uncompilable (stack
      # too deep) without touching the ones being verified.
      - name: forge build (targets only)
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          paths=$(echo "$TARGETS" | tr ',' '\n' | xargs -n1 | cut -d: -f2 | sort -u | tr '\n' ' ')
          echo "building: $paths"
          forge build $paths

      - name: Verify
        env:
          TARGETS: ${{ inputs.targets }}
          VERIFIER: ${{ inputs.verifier }}
          ARBISCAN_API_KEY: ${{ secrets.ARBISCAN_API_KEY }}
          ARB_SEPOLIA_RPC: ${{ secrets.ARB_SEPOLIA_RPC }}
        run: |
          rpc="${ARB_SEPOLIA_RPC:-https://sepolia-rollup.arbitrum.io/rpc}"
          fail=0
          IFS=',' read -ra entries <<< "$TARGETS"
          for e in "${entries[@]}"; do
            e=$(echo "$e" | xargs)
            addr="${e%%:*}"; id="${e#*:}"
            echo "::group::$id at $addr"
            if [ "$VERIFIER" != "arbiscan" ]; then
              echo "-- Sourcify"
              forge verify-contract "$addr" "$id" --chain-id "$CHAIN_ID" \
                --verifier sourcify --verifier-url "$SOURCIFY" --watch || fail=1
            fi
            if [ "$VERIFIER" != "sourcify" ]; then
              echo "-- Arbiscan"
              if [ -z "$ARBISCAN_API_KEY" ]; then
                echo "ARBISCAN_API_KEY secret not set, skipping Arbiscan."
              else
                forge verify-contract "$addr" "$id" --chain-id "$CHAIN_ID" \
                  --verifier etherscan --etherscan-api-key "$ARBISCAN_API_KEY" \
                  --guess-constructor-args --rpc-url "$rpc" --watch || fail=1
              fi
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Sourcify result
        if: always()
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          echo "### Targets after verification" >> "$GITHUB_STEP_SUMMARY"
          IFS=',' read -ra entries <<< "$TARGETS"
          for e in "${entries[@]}"; do
            e=$(echo "$e" | xargs); addr="${e%%:*}"; id="${e#*:}"
            m=$(curl -sS -m 20 "$SOURCIFY/v2/contract/$CHAIN_ID/$addr" | jq -r '.match // "none"' 2>/dev/null || echo "error")
            echo "$id $addr ${m:-none}"
            echo "- \`$id\` \`$addr\`: ${m:-none}" >> "$GITHUB_STEP_SUMMARY"
          done
