name: TimbSwap Faucet Invariants

# Read-only monitor of the faucet claim record (scripts/faucet-invariants.js):
# does what was dispensed fit inside what the cooldown and the era permit? A
# breach means the cooldown was bypassed — a different and worse failure than
# the budget draining — so it alerts and fails the run. No private key: it only
# reads the chain and commits a compact cursor/tally state back, like the epoch
# keeper. Claims are paced daily, so every six hours is plenty.

on:
  schedule:
    - cron: "23 */6 * * *"   # offset from the top of the hour
  workflow_dispatch:
    inputs:
      report:
        description: "Post a Telegram summary even when healthy"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

concurrency:
  group: timbswap-faucet-invariants
  cancel-in-progress: false

permissions:
  contents: write   # commits scripts/faucet-invariants-state.json back

jobs:
  check:
    name: Check claim record
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install ethers
        working-directory: scripts

      - name: Self-test the invariant logic
        working-directory: scripts
        run: node faucet-invariants.js --self-test

      - name: Check the live record
        id: check
        working-directory: scripts
        env:
          ARB_SEPOLIA_RPC:      ${{ secrets.ARB_SEPOLIA_RPC }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          # First-run scan start. Set it to the GasFaucet deploy block; the
          # fallback (latest − 3,000,000) can miss older claims.
          FAUCET_GENESIS_BLOCK: ${{ vars.FAUCET_GENESIS_BLOCK }}
          FAUCET_ERA_DAYS:      ${{ vars.FAUCET_ERA_DAYS }}
          FAUCET_ERA_START:     ${{ vars.FAUCET_ERA_START }}
          FAUCET_PACE_SLACK:    ${{ vars.FAUCET_PACE_SLACK }}
        run: |
          if [ "${{ github.event.inputs.report }}" = "yes" ]; then
            node faucet-invariants.js --report
          else
            node faucet-invariants.js
          fi

      # The state file is the cursor: without it every run rescans from genesis
      # and re-fetches every claim's block. Commit it back even when the check
      # failed (a breach must not make the next run forget where it was).
      - name: Commit state
        if: always()
        run: |
          if git diff --quiet scripts/faucet-invariants-state.json 2>/dev/null && \
             ! git status --porcelain scripts/faucet-invariants-state.json | grep -q .; then
            echo "No state change — nothing to commit."
            exit 0
          fi
          git config user.name  "faucet-invariants[bot]"
          git config user.email "actions@github.com"
          git add scripts/faucet-invariants-state.json
          git commit -m "[skip ci] faucet: update invariant-monitor state"
          # npm install dirties scripts/; --autostash keeps the rebase clean.
          git pull --rebase --autostash origin main
          git push origin main
